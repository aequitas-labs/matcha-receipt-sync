<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F3E2E"/>
      <stop offset="100%" stop-color="#1e2a1e"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#dots)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="4" height="280" fill="#88B04B"/>

  <!-- Logo: rounded square + sprout icon -->
  <rect x="24" y="24" width="44" height="44" rx="10" fill="#88B04B"/>
  <g transform="translate(31, 31) scale(1.25)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 20h10" />
    <path d="M10 20c5.5-2.5.8-6.4 3-10" />
    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z" />
    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" />
  </g>

  <!-- App name: Geist Sans, tracking-tight, bold -->
  <text x="80" y="44"
    font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="16" font-weight="700" fill="#F3F1E8"
    letter-spacing="-0.4">matcha money</text>
  <!-- Subtitle: JetBrains Mono -->
  <text x="80" y="61"
    font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
    font-size="11" font-weight="400" fill="#88B04B"
    letter-spacing="0" opacity="0.85">receipt sync</text>

  <!-- Divider -->
  <line x1="28" y1="90" x2="412" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Main headline -->
  <text x="28" y="132"
    font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="30" font-weight="700" fill="#F3F1E8"
    letter-spacing="-0.75">Clarify your data.</text>
  <text x="28" y="168"
    font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="30" font-weight="700" fill="#88B04B"
    letter-spacing="-0.75">Develop your ritual.</text>

  <!-- Subline -->
  <text x="28" y="196"
    font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
    font-size="11" font-weight="400" fill="#F3F1E8"
    opacity="0.5" letter-spacing="0">Amazon · Costco · Walmart · Target</text>

  <!-- Divider -->
  <line x1="28" y1="213" x2="412" y2="213" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Feature pills -->
  <rect x="28" y="224" width="118" height="24" rx="12" fill="#88B04B" opacity="0.15"/>
  <text x="87" y="240"
    font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
    font-size="10" font-weight="600" fill="#88B04B"
    text-anchor="middle">CSV / JSON export</text>

  <rect x="154" y="224" width="96" height="24" rx="12" fill="#88B04B" opacity="0.15"/>
  <text x="202" y="240"
    font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
    font-size="10" font-weight="600" fill="#88B04B"
    text-anchor="middle">free to use</text>

  <rect x="258" y="224" width="154" height="24" rx="12" fill="#88B04B" opacity="0.15"/>
  <text x="335" y="240"
    font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
    font-size="10" font-weight="600" fill="#88B04B"
    text-anchor="middle">sync with matcha money</text>
</svg>
